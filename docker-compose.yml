services:
  recovery:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/recovery.sqlite
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
